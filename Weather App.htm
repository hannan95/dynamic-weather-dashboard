.nav .toggle p{
    font-size: 1.1rem;
    border: 1px solid #28282B;
    cursor: pointer;
    padding: 5px;
    display:flex;
    align-items: center;
    justify-content: center;
    position: relative;
    /* border-radius: 10px; */
    background-color: transparent;
    box-shadow: none;
    transition: all 0.1s linear;
    overflow: hidden;
    

}
.nav .toggle p.active{
    /* background-color: aqua; */
    box-shadow: 0px 5px 3px #28282B;
    transition: all 0.1s linear;

}
.nav .toggle .Celcius{
    border-radius: 10px 0px 0px 10px;

}

.nav .toggle .fehreinheit{
    border-radius: 0px 10px 10px 0px;

}


.nav .toggle p::after{

  position: absolute;
  content: '';
  width: 100%;
  height: 100%;
  translate: 0 105%;
  background-color: aqua;
  z-index: -1;
  transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
}
.nav .toggle .Celcius.active::after{
    translate: 0 0;
}

.nav .toggle .fehreinheit.active::after{
    translate: 0 0;
}
